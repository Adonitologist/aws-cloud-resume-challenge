name: "Serverless Resume CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: "Test & Security Scans"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies & Run Backend Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt boto3
          AWS_ACCESS_KEY_ID=testing AWS_SECRET_ACCESS_KEY=testing AWS_DEFAULT_REGION=us-east-1 PYTHONPATH=backend python -m unittest backend/test_lambda.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format & Init
        run: |
          terraform fmt -check
          terraform init -backend=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact

      - name: tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: false